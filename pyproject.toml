[project]
name = "vnpipe"
version = "0.1.0"
description = "Public-domain play text -> annotated JSON -> Ren'Py visual novel pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "jsonschema>=4.23",
    "pillow>=11.0",
]

[project.scripts]
vnpipe = "vnpipe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vnpipe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
